<!doctype html>
<html lang="zh-CN" data-title="monitor.title">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhoneMic · 浏览器监听</title>
<script src="/i18n.js"></script>
<style>
  :root { --bg:#0a0e13; --card:#121821; --line:#223040; --text:#e8eef6; --dim:#8595a8; --accent:#38d39f; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font:15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
    background-image: radial-gradient(90% 50% at 50% -10%, #14324a 0%, transparent 60%);
  }
  .box { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:26px; text-align:center; }
  h1 { font-size:18px; margin:0 0 6px; }
  p { color:var(--dim); font-size:13.5px; margin:0 0 20px; }
  button {
    width:100%; padding:15px; border:0; border-radius:14px; cursor:pointer; font-size:15px; font-weight:600;
    color:#fff; background:linear-gradient(160deg,#2f8f6f,#1b5c47); transition:.15s;
  }
  button:active { transform:scale(.98); }
  button.on { background:linear-gradient(160deg,#b3392f,#7d2320); }
  .meter { height:10px; background:#0d141c; border-radius:99px; overflow:hidden; margin:20px 0 8px; }
  .meter i { display:block; height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,var(--accent),#22b8cf); transition:width .07s linear; }
  .lab { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); }
  select {
    width:100%; margin-top:16px; padding:10px; border-radius:10px; background:#0d141c; color:var(--text);
    border:1px solid var(--line); font-size:13px;
  }
  .note { margin-top:16px; font-size:12px; color:#5b6b7d; line-height:1.7; text-align:left; }
  code { background:#0d141c; padding:1px 5px; border-radius:5px; }
  .langbtn { position:fixed; top:16px; right:16px; padding:5px 12px; border-radius:99px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<button class="langbtn" type="button" data-lang-toggle>EN</button>
<div class="box">
  <h1 data-i18n="monitor.h1">🔊 浏览器监听</h1>
  <p data-i18n="monitor.p">用电脑的浏览器播放手机传过来的声音（不想让服务占用声卡时用这个）</p>

  <button id="btn" data-i18n="monitor.start">开始播放</button>

  <div class="meter"><i id="meter"></i></div>
  <div class="lab"><span id="state" data-i18n="monitor.stopped">已停止</span><span id="rate">--</span></div>

  <select id="sink" hidden></select>

  <div class="note" data-i18n-html="monitor.note">
    提示：Windows 上可以用 <code>--device</code> 直接输出到声卡，不需要这个页面。<br>
    在这里播放同样可以选择输出设备（Chrome 支持），包括虚拟声卡 <code>VB-Audio</code>。
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const t = (key, vars) => window.PMI18N.t(key, vars);
  let ctx = null, ws = null, gainNode = null, playHead = 0, playing = false;
  let rate = 48000, peak = 0, level = 0;

  function meterLoop() {
    const target = Math.min(1, level * 5);
    peak = Math.max(target, peak * 0.87);
    level *= 0.6;
    $('meter').style.width = Math.min(100, peak * 100) + '%';
    requestAnimationFrame(meterLoop);
  }

  async function start() {
    ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: rate });
    await ctx.resume();
    if (ctx.sampleRate !== rate) {
      console.warn(t('monitor.resample', { actual: ctx.sampleRate, expected: rate }));
    }
    gainNode = ctx.createGain();
    gainNode.gain.value = 1;
    gainNode.connect(ctx.destination);
    playHead = 0;

    const q = new URLSearchParams(location.search);
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const token = q.get('k');
    ws = new WebSocket(`${proto}//${location.host}/ws?role=monitor${token ? '&k=' + token : ''}`);
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
      playing = true;
      $('btn').textContent = t('monitor.stop');
      $('btn').classList.add('on');
      $('state').textContent = t('monitor.playing');
      $('state').style.color = 'var(--accent)';
    };

    ws.onmessage = (e) => {
      if (typeof e.data === 'string') {
        try {
          const m = JSON.parse(e.data);
          if (m.t === 'ready' && m.outRate) {
            rate = m.outRate;
            $('rate').textContent = (rate / 1000).toFixed(1) + ' kHz';
          }
        } catch (err) {}
        return;
      }
      if (!playing || !ctx) return;
      pushPcm(new Int16Array(e.data));
    };

    ws.onclose = () => stop();

    await listDevices();
  }

  function pushPcm(pcm) {
    const n = pcm.length;
    if (!n) return;

    let sum = 0;
    const f32 = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const v = pcm[i] / 32768;
      f32[i] = v;
      sum += v * v;
    }
    const rms = Math.sqrt(sum / n);
    if (rms > level) level = rms;

    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    buf.copyToChannel(f32, 0);

    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(gainNode);

    const now = ctx.currentTime;
    if (playHead < now + 0.03) playHead = now + 0.15; // 断流后重新垫缓冲
    try { src.start(playHead); } catch (e) { return; }
    playHead += buf.duration;
    src.onended = () => { try { src.disconnect(); } catch (e) {} };
  }

  function stop() {
    playing = false;
    if (ws) { try { ws.close(); } catch (e) {} ws = null; }
    if (ctx) { try { ctx.close(); } catch (e) {} ctx = null; }
    $('btn').textContent = t('monitor.start');
    $('btn').classList.remove('on');
    $('state').textContent = t('monitor.stopped');
    $('state').style.color = '';
  }

  async function listDevices() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices || !ctx.setSinkId) return;
    try {
      const devs = await navigator.mediaDevices.enumerateDevices();
      const outs = devs.filter((d) => d.kind === 'audiooutput');
      if (outs.length < 2) return;
      const sel = $('sink');
      sel.innerHTML = outs.map((d) => `<option value="${d.deviceId}">${d.label || t('monitor.output')}</option>`).join('');
      sel.hidden = false;
      sel.onchange = async () => {
        try { await ctx.setSinkId(sel.value); } catch (e) { console.warn(e); }
      };
    } catch (e) { /* 忽略 */ }
  }

  $('btn').addEventListener('click', () => {
    if (playing) stop();
    else start();
  });

  meterLoop();
  fetch('/api/status').then((r) => r.json()).then((d) => {
    rate = d.outRate || 48000;
    $('rate').textContent = (rate / 1000).toFixed(1) + ' kHz';
  }).catch(() => {});
})();
</script>
</body>
</html>
